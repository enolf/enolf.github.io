<head>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <style>
        .info {
            padding: 6px 8px;
            font: 14px/16px Arial, Helvetica, sans-serif;
            background: white;
            background: rgba(255,255,255,0.8);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
        }
        .info h4 {
            margin: 0 0 5px;
            color: #777;
        }
        .legend {
            line-height: 18px;
            color: #555;
        }
        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.7;
        }
    </style>

</head>
<body>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="">
    </script>


    <div
        id="map"
        style="height: 400px; width: 600px;">
    </div>
    
    <div class="timeline-container">
        <input type="range" id="month-slider" min="0" max="11" value="0" step="1">
        <label for="month-slider">Month: <span id="month-label">January</span></label>
    </div>

    <script type="text/javascript">

        const months = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        let map; // stores Leaflet map
        let geoLayer; // stores geoJSON overlays
        let tickData; // stores pest data

        var geojson;

        // colour function for the shading
        function getColor(pest) {
            return  pest > 25 ? '#08589e':
                    pest > 20 ? '#2b8cbe':
                    pest > 15 ? '#4eb3d3':
                    pest > 10 ? '#7bccc4':
                    pest > 5  ? '#a8ddb5':
                    pest > 0  ? '#ccebc5':
                                '#f0f9e8';
        }

        // returns Month Index selected on slider
        function getSelectedMonthIndex() {
            const slider = document.getElementById('month-slider');

            return parseInt(slider.value);
        }

        // returns Month from months array based on Month Index; defaults to current month
        function getMonth (monthIndex = getSelectedMonthIndex()) {
            const month = months[monthIndex];

            return month
        }

        // returns Month Name from monthsNames array based on Month Index
        function getMonthName (monthIndex = getSelectedMonthIndex()) {
            const monthName = monthNames[monthIndex];

            return monthName
        }

        function getSuburbStyle(feature, selectedMonth = getMonth()) {
            const id = feature.properties.suburb_id;
            const cases = tickData[id][selectedMonth] || 0;

            return {
                fillColor: getColor(cases),                        
                weight: 1,
                opacity: 1,
                color: 'white',
                fillOpacity: 0.7
            };
        }

        // updates map based on month
        function updateMap(monthIndex) {
            const selectedMonth = months[monthIndex];
            document.getElementById('month-label').innerText = monthNames[monthIndex]; // update month on slider

            if (geoLayer) { // guard incase map needs to update before data is loaded
                geoLayer.setStyle(feature => getSuburbStyle(feature, selectedMonth));
            }
        }

        function highlightSuburb(e) {
            var layer = e.target;

            layer.setStyle({
                weight: 3,
                color: '#777',
                dashArray: '1',
                fillOpacity: 0.7
            });
            
            layer.bringToFront();

            info.update(layer.feature.properties);
        }
        
        function resetHighlight(e) {
            geoLayer.resetStyle(e.target);
            
            info.update();
        }

        function zoomToSuburb(e) {
            map.fitBounds(e.target.getBounds());
        }

        function onEachFeature(feauture, layer) {
            layer.on({
                mouseover: highlightSuburb,
                mouseout: resetHighlight,
                click: zoomToSuburb
            });
        }

        const info = L.control();

        info.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info');
            this.update();
            return this._div;
        };

        info.update = function (props) {
            const selectedMonth = getMonth(); 
            const monthName = getMonthName(getSelectedMonthIndex());

            if (props) {
                const id = props.suburb_id;
                const cases = tickData[id][selectedMonth];
                
                this._div.innerHTML = `<h4>Cases in Cairns Region</h4>
                    <b>${props.name || id}</b><br />
                    ${cases} tick cases in ${monthName}`;
            }
            else {
                this._div.innerHTML = '<h4>Cases in Cairns Region</h4>Hover over a suburb';
            }
        };

        const legend = L.control({position: 'bottomright'});

        legend.onAdd = function (map) {

            var div = L.DomUtil.create('div', 'info legend'),
                grades = [0, 5, 10, 15, 20, 25],
                labels = [];

            for (var i = 0; i < grades.length; i++) {
                div.innerHTML +=
                    '<i style="background:' + getColor(grades[i] + 1) + '"></i> ' +
                    grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '<br>' : '+');
            }

            return div;
        };

        async function initMap() {
            map = L.map('map').setView([-16.920298801405686, 145.77101107749607], 12);

            L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.png', {
                maxZoom: 20,
                attribution: '&copy; <a href="https://stadiamaps.com/" target="_blank">Stadia Maps</a> &copy; <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>', 
            }).addTo(map);

            try {
                const [geoRes, statsRes] = await Promise.all([
                    fetch("{{ '/assets/maps/cairns.json' | relative_url }}"),
                    fetch("{{ '/assets/data/tick-stats.json' | relative_url }}")
                ]);

                geojson = await geoRes.json();
                tickData = await statsRes.json();

                geoLayer = L.geoJSON(geojson, {
                    style: getSuburbStyle,
                    onEachFeature: onEachFeature
                }).addTo(map);

                map.fitBounds(geoLayer.getBounds());

                info.addTo(map);

                legend.addTo(map);

                const slider = document.getElementById('month-slider');

                slider.addEventListener('input', function(e) {
                    updateMap(e.target.value);
                });

                updateMap(0);

            } catch(error) {
                console.error("Error loading map data: ", error);
            }    
        }

        window.onload = initMap();

    </script>

</body>
